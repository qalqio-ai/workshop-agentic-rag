[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "workshop-agentic-rag"
version = "0.1.0"
description = "A local-first, bounded, multi-use-case Agentic RAG API starter."
requires-python = ">=3.11"
dependencies = [
  "fastapi==0.115.12",
  "uvicorn[standard]==0.34.2",
  "qdrant-client==1.14.2",
  "fastembed==0.7.1",
  "openai==1.78.1",
]

[project.optional-dependencies]
dev = ["httpx==0.28.1", "pytest==8.3.5", "ruff==0.11.9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
